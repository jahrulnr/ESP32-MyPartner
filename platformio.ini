; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc1-n16r8

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_rts = 0
monitor_dtr = 0
monitor_speed = 115200
upload_protocol = esptool
lib_compat_mode = strict
lib_ldf_mode = chain
monitor_filters = esp32_exception_decoder, send_on_enter, time
board_build.filesystem = littlefs
build_unflags = 
	-Werror=all
	-Wimplicit-fallthrough
	-Wunused-but-set-variable
	-Wunused-function
	-fno-exceptions
	-Os
build_src_filter = +<*> -<services/MultiNetRecognizer.cpp> -<services/PicoGreeting.cpp>
lib_deps = 
	https://github.com/tanakamasayuki/EspUsbDevice.git#3fed50d0d777f600432b71381faccd93adb9a202
	olikraus/U8g2
	bblanchon/ArduinoJson@^7.4.3
	links2004/WebSockets@^2.6.1
	knolleary/PubSubClient@^2.8
	https://github.com/dplasa/FTPClientServer.git
	https://github.com/jahrulnr/esp32-picoTTS.git
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCFG_TUD_CDC=1
	-DCFG_TUD_NCM=0
	-DCFG_TUD_MSC=0
	-DCORE_DEBUG_LEVEL=3
	-DLOG_LOCAL_LEVEL=5 ; ESP_LOG*
	-DARDUINO_PARTITION_esp_sr_16
	-Wno-maybe-uninitialized
	-Wno-missing-field-initializers
	-Wno-error=sign-compare
	-Wno-error=double-promotion
	-Wno-type-limits
	-DCONFIG_ARDUHAL_LOG_COLORS
	-DCONFIG_ARDUINO_ISR_IRAM=0
	-DCONFIG_SPIRAM_USE_MALLOC=1
	-DCONFIG_ESP32S3_DATA_CACHE_LINE_64B=1
	-DCONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=1
	-DCONFIG_SR_VADN_VADNET1_MEDIUM=1
	-DCONFIG_SR_NSN_NSNET2=1
	-DCONFIG_APP_BUILD_TYPE_PURE_RAM_APP=1
	-DCONFIG_APP_BUILD_TYPE_RAM=1
	-DCONFIG_NEWLIB_NANO_FORMAT=1
	-DCONFIG_ESP_SYSTEM_PANIC_PRINT_HALT=1
	-DCONFIG_ESP_DEBUG_STUBS_ENABLE=
	-DCONFIG_ESP_PANIC_HANDLER_IRAM=1
	-DESP_NN
	-O3
	-g
	-DWEBSOCKETS_MAX_DATA_SIZE=512000
extra_scripts = 
	tools/partition_manager.py
	; tools/multinet_g2p.py
platform_packages = tool-esp32partitiontool@https://github.com/serifpersia/esp32partitiontool/releases/download/v1.4.5/esp32partitiontool-platformio.zip

[env:esp32-s3-devkitc1-n16r8]
board = esp32-s3-devkitc1-n16r8
board_build.partitions = boards/esp32-s3-devkitc1-n16r8.csv
build_flags = 
	${env.build_flags}
	-DESP32S3_DEVKITC1_N16R8

[env:esp32-s3-voice-comparison]
extends = env:esp32-s3-devkitc1-n16r8
build_flags =
	${env:esp32-s3-devkitc1-n16r8.build_flags}
	-DPARTNER_MODEL_COMPARE_PROBE

[env:esp32-s3-analog-mic]
extends = env:esp32-s3-devkitc1-n16r8
build_flags =
    ${env:esp32-s3-devkitc1-n16r8.build_flags}
    -DMIC_USE_INMP441=0
